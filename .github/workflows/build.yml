name: Build wallpaper list

on:
  push:
    branches: [main]
    paths: ["photos/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: python scripts/build_manifest.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photos wallpapers.json collections
          git diff --cached --quiet || git commit -m "Update wallpapers"
          git push
